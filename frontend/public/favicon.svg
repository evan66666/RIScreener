<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0b192e"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0072ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- Outer Radar Glow Circle -->
  <circle cx="32" cy="32" r="24" stroke="#16385c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="17" stroke="#1a4674" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="10" stroke="#225b96" stroke-width="1.5"/>

  <!-- Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#16385c" stroke-width="1.2"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#16385c" stroke-width="1.2"/>

  <!-- Radar Sweep Sector -->
  <path d="M 32 32 L 49 15 A 24 24 0 0 0 32 8 Z" fill="url(#sweepGrad)"/>

  <!-- Center Core & Glow -->
  <circle cx="32" cy="32" r="8" fill="url(#centerGlow)"/>
  <circle cx="32" cy="32" r="3.5" fill="#00f2fe" filter="url(#glow)"/>

  <!-- Detected Signal Target Blip (Top Right) -->
  <circle cx="44" cy="20" r="3.5" fill="#00ffc2" filter="url(#glow)"/>
  <circle cx="44" cy="20" r="6" stroke="#00ffc2" stroke-width="1" stroke-opacity="0.6">
    <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Early Signal Target Blip (Bottom Left) -->
  <circle cx="20" cy="41" r="2.5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Pulse Border Ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>